<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Override</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #07070f;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", Courier, monospace;
  }
  #gameCanvas {
    display: block;
    background: #07070f;
    box-shadow: 0 0 40px rgba(0, 240, 255, 0.15), 0 0 2px rgba(255, 43, 214, 0.6);
    transition: filter 120ms linear;
  }
  /* Overdrive: retro-pop color inversion, applied by toggling a class (no per-frame cost). */
  #gameCanvas.overdrive {
    filter: invert(1) hue-rotate(180deg);
  }
</style>
</head>
<body>
<canvas id="gameCanvas" width="480" height="800" aria-label="Apex Override game"></canvas>
<script>
'use strict';

// =====================================================================
// CONFIG — every tunable lives here.
// =====================================================================
const CONFIG = {
  width: 480,
  height: 800,
  road: { left: 30, right: 450, lanes: 6 },
  hud: { top: 52, bottom: 56 },
  player: {
    w: 34, h: 56, hitInset: 5,
    accelX: 3400, accelY: 2400,
    frictionX: 0.90, frictionY: 0.85, // velocity retained per 1/60 s
    maxVx: 540, maxVy: 320,
    minYFrac: 0.40,
    maxHealth: 3, invulnTime: 1.5,
  },
  dash: { window: 0.22, speed: 1200, duration: 0.12, cooldown: 0.6, ramGrace: 0.08, carry: 0.55, verticalScale: 0.7 },
  sweep: { radius: 70, duration: 0.35, cooldown: 1.2, spins: 2 },
  overdrive: { max: 100, duration: 6, speedMult: 2, gainKill: 12, gainRam: 15, gainNearMiss: 6 },
  nearMiss: { margin: 18 },
  scroll: { base: 380 },
  difficulty: { levelTime: 30, speedGrowth: 1.12, maxSpeedMult: 2.0, spawnBase: 1.35, spawnDecay: 0.88, spawnMin: 0.45 },
  enemy: { w: 36, h: 54, homerMaxVx: 110, homerAccel: 260, knockLife: 0.9 },
  score: { perSecond: 10, kill: 100, nearMiss: 25, overdriveMult: 2 },
  fx: { maxParticles: 700, streaks: 28 },
};

const COLORS = {
  bg: '#07070f',
  road: '#0d0d1c',
  cyan: '#00f0ff',
  magenta: '#ff2bd6',
  yellow: '#ffe600',
  orange: '#ff8a00',
  red: '#ff0040',
  dim: '#7a7aa8',
  white: '#ffffff',
};

const FONT = '"Courier New", Courier, monospace';
const HIGH_SCORE_KEY = 'apexOverride.highScore';

// =====================================================================
// Utilities
// =====================================================================
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rand = (lo, hi) => lo + Math.random() * (hi - lo);
const randInt = (lo, hi) => Math.floor(rand(lo, hi + 1));
const sign = v => (v > 0 ? 1 : v < 0 ? -1 : 0);

function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function circleRect(cx, cy, r, rect) {
  const nx = clamp(cx, rect.x, rect.x + rect.w);
  const ny = clamp(cy, rect.y, rect.y + rect.h);
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy <= r * r;
}

function expand(rect, m) {
  return { x: rect.x - m, y: rect.y - m, w: rect.w + 2 * m, h: rect.h + 2 * m };
}

function laneCenter(i) {
  const R = CONFIG.road;
  return R.left + ((R.right - R.left) / R.lanes) * (i + 0.5);
}

function drawText(ctx, str, x, y, size, color, align = 'left', glow = 0) {
  ctx.font = `bold ${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = color;
  if (glow) {
    ctx.shadowColor = color;
    ctx.shadowBlur = glow;
  }
  ctx.fillText(str, x, y);
  ctx.shadowBlur = 0;
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = (sec % 60).toFixed(1).padStart(4, '0');
  return `${m}:${s}`;
}

function loadHighScore() {
  try {
    return parseInt(localStorage.getItem(HIGH_SCORE_KEY), 10) || 0;
  } catch (e) {
    return 0;
  }
}

function saveHighScore(v) {
  try {
    localStorage.setItem(HIGH_SCORE_KEY, String(v));
  } catch (e) {
    // Storage unavailable (private mode, file:// restrictions) — high score is session-only.
  }
}

// =====================================================================
// Input Manager
// =====================================================================
const KEY_DIRS = {
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down',
};
const DIR_VECTORS = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] };
const PREVENT_DEFAULT = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'F3']);

class Input {
  constructor() {
    this.held = new Set();
    this.lastTap = {};
    this.onPress = null;      // (code) => void, fired once per physical press
    this.onDoubleTap = null;  // (dir) => void
    window.addEventListener('keydown', e => this.keydown(e));
    window.addEventListener('keyup', e => this.held.delete(e.code));
    window.addEventListener('blur', () => this.held.clear());
  }

  keydown(e) {
    if (PREVENT_DEFAULT.has(e.code)) e.preventDefault();
    this.held.add(e.code);
    if (e.repeat) return;

    const dir = KEY_DIRS[e.code];
    if (dir) {
      const now = performance.now();
      const last = this.lastTap[dir] ?? -Infinity;
      if (now - last <= CONFIG.dash.window * 1000) {
        this.lastTap[dir] = -Infinity; // a third tap starts a fresh pair
        if (this.onDoubleTap) this.onDoubleTap(dir);
      } else {
        this.lastTap[dir] = now;
      }
    }
    if (this.onPress) this.onPress(e.code);
  }

  dirHeld(dir) {
    for (const code of this.held) if (KEY_DIRS[code] === dir) return true;
    return false;
  }

  get axisX() { return (this.dirHeld('right') ? 1 : 0) - (this.dirHeld('left') ? 1 : 0); }
  get axisY() { return (this.dirHeld('down') ? 1 : 0) - (this.dirHeld('up') ? 1 : 0); }
}

// =====================================================================
// Entities
// =====================================================================
class GameObject {
  constructor(x, y, w, h) {
    this.x = x;
    this.y = y;
    this.w = w;
    this.h = h;
    this.vx = 0;
    this.vy = 0;
    this.alive = true;
  }

  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }
  get bounds() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }

  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
  }

  draw(ctx) {}
}

class Player extends GameObject {
  constructor() {
    const P = CONFIG.player;
    super(CONFIG.width / 2 - P.w / 2, CONFIG.height - CONFIG.hud.bottom - P.h - 60, P.w, P.h);
    this.health = P.maxHealth;
    this.invuln = 0;
    this.meter = 0;
    this.overdrive = 0;      // seconds of Overdrive remaining
    this.sweepTime = 0;      // seconds of active Cyclone-Sweep remaining
    this.sweepCooldown = 0;
    this.spin = 0;
    this.dashTime = 0;
    this.dashCooldown = 0;
    this.ramTime = 0;
    this.dashVx = 0;
    this.dashVy = 0;
  }

  get hitbox() {
    const i = CONFIG.player.hitInset;
    return { x: this.x + i, y: this.y + i, w: this.w - 2 * i, h: this.h - 2 * i };
  }
  get sweeping() { return this.sweepTime > 0; }
  get ramming() { return this.ramTime > 0; }
  get overdriveActive() { return this.overdrive > 0; }
  get meterFull() { return this.meter >= CONFIG.overdrive.max; }

  startSweep() {
    if (this.sweepCooldown > 0 || !this.alive) return false;
    this.sweepTime = CONFIG.sweep.duration;
    this.sweepCooldown = CONFIG.sweep.cooldown;
    this.spin = 0;
    return true;
  }

  startDash(dir) {
    if (this.dashCooldown > 0 || !this.alive) return false;
    const D = CONFIG.dash;
    const [dx, dy] = DIR_VECTORS[dir];
    const speed = D.speed * (dy ? D.verticalScale : 1);
    this.dashVx = dx * speed;
    this.dashVy = dy * speed;
    this.dashTime = D.duration;
    this.dashCooldown = D.cooldown;
    this.ramTime = D.duration + D.ramGrace;
    return true;
  }

  startOverdrive() {
    if (!this.meterFull || this.overdriveActive || !this.alive) return false;
    this.overdrive = CONFIG.overdrive.duration;
    return true;
  }

  addMeter(amount) {
    if (this.overdriveActive) return;
    this.meter = Math.min(CONFIG.overdrive.max, this.meter + amount);
  }

  update(dt, input) {
    const P = CONFIG.player, D = CONFIG.dash, S = CONFIG.sweep, O = CONFIG.overdrive;

    this.invuln = Math.max(0, this.invuln - dt);
    this.sweepCooldown = Math.max(0, this.sweepCooldown - dt);
    this.dashCooldown = Math.max(0, this.dashCooldown - dt);
    this.ramTime = Math.max(0, this.ramTime - dt);

    if (this.sweepTime > 0) {
      this.sweepTime = Math.max(0, this.sweepTime - dt);
      this.spin += dt * (Math.PI * 2 * S.spins) / S.duration;
    } else {
      this.spin = 0;
    }

    if (this.overdrive > 0) {
      this.overdrive = Math.max(0, this.overdrive - dt);
      this.meter = O.max * (this.overdrive / O.duration);
    }

    if (this.dashTime > 0) {
      // Aero-Jostle: fixed-velocity burst, ignores friction.
      this.dashTime -= dt;
      this.vx = this.dashVx;
      this.vy = this.dashVy;
      if (this.dashTime <= 0) {
        this.vx = clamp(this.dashVx * D.carry, -P.maxVx, P.maxVx);
        this.vy = clamp(this.dashVy * D.carry, -P.maxVy, P.maxVy);
      }
    } else {
      // Omni-Rig: accelerate toward input, exponential friction gives the drift.
      this.vx += input.axisX * P.accelX * dt;
      this.vy += input.axisY * P.accelY * dt;
      const f = dt * 60;
      this.vx *= Math.pow(P.frictionX, f);
      this.vy *= Math.pow(P.frictionY, f);
      this.vx = clamp(this.vx, -P.maxVx, P.maxVx);
      this.vy = clamp(this.vy, -P.maxVy, P.maxVy);
    }

    this.x += this.vx * dt;
    this.y += this.vy * dt;

    const R = CONFIG.road;
    const minX = R.left + 4, maxX = R.right - 4 - this.w;
    const minY = CONFIG.height * P.minYFrac;
    const maxY = CONFIG.height - CONFIG.hud.bottom - 8 - this.h;
    if (this.x < minX) { this.x = minX; this.vx = Math.max(0, this.vx); }
    if (this.x > maxX) { this.x = maxX; this.vx = Math.min(0, this.vx); }
    if (this.y < minY) { this.y = minY; this.vy = Math.max(0, this.vy); }
    if (this.y > maxY) { this.y = maxY; this.vy = Math.min(0, this.vy); }
  }

  draw(ctx, time) {
    const P = CONFIG.player, S = CONFIG.sweep;
    const w = this.w, h = this.h;

    ctx.save();
    ctx.translate(this.cx, this.cy);

    // Cyclone-Sweep ring (drawn unrotated, blades follow the spin).
    if (this.sweeping) {
      const t = 1 - this.sweepTime / S.duration;
      ctx.save();
      ctx.globalAlpha = 0.35 * (1 - t) + 0.1;
      ctx.strokeStyle = COLORS.cyan;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, S.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1 - t * 0.6;
      ctx.strokeStyle = COLORS.yellow;
      ctx.shadowColor = COLORS.yellow;
      ctx.shadowBlur = 16;
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      for (const offset of [0, Math.PI]) {
        ctx.beginPath();
        ctx.arc(0, 0, S.radius - 4, this.spin + offset, this.spin + offset + Math.PI * 0.8);
        ctx.stroke();
      }
      ctx.restore();
    }

    if (this.overdriveActive) {
      ctx.save();
      ctx.strokeStyle = COLORS.yellow;
      ctx.shadowColor = COLORS.yellow;
      ctx.shadowBlur = 24;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(time * 20);
      ctx.beginPath();
      ctx.ellipse(0, 0, w * 0.95, h * 0.75, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    if (this.invuln > 0 && Math.floor(this.invuln * 12) % 2 === 0) ctx.globalAlpha = 0.3;

    if (this.sweeping) {
      ctx.rotate(this.spin);
    } else {
      // Lean the nose into the drift without changing heading.
      ctx.transform(1, 0, -(this.vx / P.maxVx) * 0.25, 1, 0, 0);
    }

    const stroke = this.ramming ? COLORS.white : (this.overdriveActive ? COLORS.yellow : COLORS.cyan);

    // Omni-Rig sphere tires.
    ctx.fillStyle = stroke;
    ctx.shadowColor = stroke;
    ctx.shadowBlur = 8;
    for (const [tx, ty] of [[-w / 2, -h / 2 + 18], [w / 2, -h / 2 + 18], [-w / 2, h / 2 - 8], [w / 2, h / 2 - 8]]) {
      ctx.beginPath();
      ctx.arc(tx, ty, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Body: sharp wedge.
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#101a2a';
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -h / 2);
    ctx.lineTo(w / 2 - 2, -h / 2 + 20);
    ctx.lineTo(w / 2 - 2, h / 2);
    ctx.lineTo(-w / 2 + 2, h / 2);
    ctx.lineTo(-w / 2 + 2, -h / 2 + 20);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Cockpit.
    ctx.shadowBlur = 0;
    ctx.fillStyle = COLORS.magenta;
    ctx.beginPath();
    ctx.moveTo(0, -h / 2 + 12);
    ctx.lineTo(7, 2);
    ctx.lineTo(-7, 2);
    ctx.closePath();
    ctx.fill();

    // Spoiler.
    ctx.fillStyle = stroke;
    ctx.fillRect(-w / 2, h / 2 - 5, w, 4);

    ctx.restore();
  }
}

class Enemy extends GameObject {
  constructor(x, y, type, rel) {
    const E = CONFIG.enemy;
    super(x, y, E.w, E.h);
    this.type = type;           // 'blocker' | 'homer'
    this.rel = rel;             // fraction of scroll speed at which it closes on the player
    this.state = 'active';      // 'active' | 'knocked'
    this.color = type === 'homer' ? COLORS.orange : COLORS.magenta;
    this.rot = 0;
    this.spinRate = 0;
    this.life = 0;
    this.grazed = false;        // came within near-miss range
    this.touched = false;       // overlapped the player (disqualifies near-miss)
    this.nearMissCounted = false;
  }

  knock(dx, dy) {
    const len = Math.hypot(dx, dy) || 1;
    this.state = 'knocked';
    this.vx = (dx / len) * 700 + rand(-60, 60);
    this.vy = (dy / len) * 600 + rand(-60, 60);
    this.spinRate = rand(10, 16) * (sign(dx) || 1);
    this.life = CONFIG.enemy.knockLife;
  }

  update(dt, game) {
    const W = CONFIG.width, H = CONFIG.height;

    if (this.state === 'knocked') {
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.rot += this.spinRate * dt;
      this.life -= dt;
      if (this.life <= 0 || this.x < -80 || this.x > W + 80 || this.y < -120 || this.y > H + 80) this.alive = false;
      return;
    }

    this.vy = this.rel * game.scrollSpeed;
    const p = game.player;
    if (this.type === 'homer' && p.alive && this.y + this.h < p.y) {
      const E = CONFIG.enemy;
      const desired = clamp((p.cx - this.cx) * 1.5, -E.homerMaxVx, E.homerMaxVx);
      this.vx += clamp(desired - this.vx, -E.homerAccel * dt, E.homerAccel * dt);
    } else if (this.type === 'homer') {
      this.vx *= Math.pow(0.9, dt * 60);
    }

    this.x += this.vx * dt;
    this.y += this.vy * dt;
    const R = CONFIG.road;
    this.x = clamp(this.x, R.left + 2, R.right - 2 - this.w);
    if (this.y > H + 20) this.alive = false;
  }

  draw(ctx) {
    const w = this.w, h = this.h, c = this.color;
    ctx.save();
    ctx.translate(this.cx, this.cy);
    ctx.rotate(this.rot);
    if (this.state === 'knocked') ctx.globalAlpha = clamp(this.life / CONFIG.enemy.knockLife, 0, 1);

    ctx.lineWidth = 2;
    ctx.strokeStyle = c;
    ctx.fillStyle = '#14081a';
    ctx.shadowColor = c;
    ctx.shadowBlur = 10;

    if (this.type === 'blocker') {
      // Corporate Blocker: boxy hauler with a ram bar.
      ctx.beginPath();
      ctx.rect(-w / 2, -h / 2 + 6, w, h - 6);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = c;
      ctx.fillRect(-w / 2 - 3, -h / 2, w + 6, 6);
      ctx.shadowBlur = 0;
      ctx.globalAlpha *= 0.7;
      ctx.fillRect(-w / 2 + 6, -6, w - 12, 4);
      ctx.fillRect(-w / 2 + 6, 4, w - 12, 4);
    } else {
      // Homer: sharp interceptor wedge with a sensor eye.
      ctx.beginPath();
      ctx.moveTo(0, -h / 2);
      ctx.lineTo(w / 2, h / 2 - 6);
      ctx.lineTo(w / 4, h / 2);
      ctx.lineTo(-w / 4, h / 2);
      ctx.lineTo(-w / 2, h / 2 - 6);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.shadowColor = COLORS.red;
      ctx.fillStyle = COLORS.red;
      ctx.fillRect(-8, -2, 16, 3);
    }
    ctx.restore();
  }
}

class Particle {
  constructor(x, y, vx, vy, life, color, size, kind = 'dot') {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.life = life;
    this.maxLife = life;
    this.color = color;
    this.size = size;
    this.kind = kind; // 'dot' | 'ring'
  }

  get alive() { return this.life > 0; }

  update(dt) {
    this.life -= dt;
    if (this.kind === 'ring') {
      this.size += 220 * dt;
      return;
    }
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    const drag = Math.pow(0.93, dt * 60);
    this.vx *= drag;
    this.vy *= drag;
  }

  draw(ctx) {
    const a = clamp(this.life / this.maxLife, 0, 1);
    ctx.globalAlpha = a;
    if (this.kind === 'ring') {
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 3 * a + 1;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      const s = this.size;
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x - s / 2, this.y - s / 2, s, s);
    }
  }
}

// =====================================================================
// Spawner — formations of Corporate Blockers
// =====================================================================
class Spawner {
  constructor(game) {
    this.game = game;
    this.timer = 1.2;
  }

  update(dt) {
    this.timer -= dt;
    if (this.timer <= 0) {
      const delayMult = this.spawnFormation();
      this.timer = this.game.spawnInterval * delayMult;
    }
  }

  pickFormation(level) {
    const wedge = Math.min(0.25 + level * 0.05, 0.4);
    const wall = Math.min(0.08 + level * 0.06, 0.35);
    const r = Math.random();
    if (r < wall) return 'wall';
    if (r < wall + wedge) return 'wedge';
    return 'single';
  }

  spawnFormation() {
    const g = this.game, level = g.level, lanes = CONFIG.road.lanes, E = CONFIG.enemy;
    const spawnY = -E.h - 10;
    const place = (lane, yOffset, type, rel) => {
      const x = laneCenter(lane) - E.w / 2;
      g.enemies.push(new Enemy(x, spawnY - yOffset, type, rel));
    };

    switch (this.pickFormation(level)) {
      case 'wall': {
        const gap = level < 2 ? 2 : 1;
        const gapStart = randInt(0, lanes - gap);
        const rel = rand(0.42, 0.52);
        for (let i = 0; i < lanes; i++) {
          if (i < gapStart || i >= gapStart + gap) place(i, 0, 'blocker', rel);
        }
        return 1.6;
      }
      case 'wedge': {
        const n = level >= 2 && Math.random() < 0.5 ? 5 : 3;
        const half = (n - 1) / 2;
        const apex = randInt(half, lanes - 1 - half);
        const rel = rand(0.45, 0.6);
        for (let k = -half; k <= half; k++) place(apex + k, Math.abs(k) * 70, 'blocker', rel);
        return 1.3;
      }
      default: {
        const homerChance = Math.min(0.15 + level * 0.08, 0.5);
        const type = Math.random() < homerChance ? 'homer' : 'blocker';
        const lane = randInt(0, lanes - 1);
        g.enemies.push(new Enemy(laneCenter(lane) - E.w / 2 + rand(-10, 10), spawnY, type, rand(0.4, 0.65)));
        return 1.0;
      }
    }
  }
}

// =====================================================================
// Game — state machine, systems, rendering
// =====================================================================
class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.input = new Input();
    this.input.onPress = code => this.handlePress(code);
    this.input.onDoubleTap = dir => {
      if (this.state === 'PLAYING' && this.player.startDash(dir)) this.onDash();
    };
    this.highScore = loadHighScore();
    this.debug = false;
    this.fps = 60;
    this.time = 0;
    this.pxScale = 1;

    this.reset();
    this.state = 'START'; // START | PLAYING | PAUSED | DYING | GAME_OVER

    this.resize();
    window.addEventListener('resize', () => this.resize());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && this.state === 'PLAYING') this.state = 'PAUSED';
    });
  }

  reset() {
    this.player = new Player();
    this.enemies = [];
    this.particles = [];
    this.floaters = [];
    this.streaks = Array.from({ length: CONFIG.fx.streaks }, () => this.newStreak(true));
    this.spawner = new Spawner(this);
    this.elapsed = 0;
    this.level = 0;
    this.score = 0;
    this.kills = 0;
    this.nearMisses = 0;
    this.scrollY = 0;
    this.scrollSpeed = CONFIG.scroll.base;
    this.shake = 0;
    this.flash = 0;
    this.flashColor = COLORS.white;
    this.banner = null;
    this.deathTimer = 0;
    this.overTime = 0;
    this.newHigh = false;
    this.wasOverdrive = false;
    this.canvas.classList.remove('overdrive');
  }

  resize() {
    const W = CONFIG.width, H = CONFIG.height;
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    const dpr = window.devicePixelRatio || 1;
    this.canvas.style.width = Math.floor(W * scale) + 'px';
    this.canvas.style.height = Math.floor(H * scale) + 'px';
    this.canvas.width = Math.round(W * scale * dpr);
    this.canvas.height = Math.round(H * scale * dpr);
    this.pxScale = scale * dpr;
  }

  // ---------- derived difficulty ----------
  get levelSpeedMult() {
    const D = CONFIG.difficulty;
    return Math.min(Math.pow(D.speedGrowth, this.level), D.maxSpeedMult);
  }

  get spawnInterval() {
    const D = CONFIG.difficulty;
    return Math.max(D.spawnBase * Math.pow(D.spawnDecay, this.level), D.spawnMin);
  }

  get scoreMult() {
    return this.player.overdriveActive ? CONFIG.score.overdriveMult : 1;
  }

  // ---------- input ----------
  handlePress(code) {
    if (code === 'F3') {
      this.debug = !this.debug;
      return;
    }
    switch (this.state) {
      case 'START':
        if (code === 'Enter' || code === 'Space') this.startGame();
        break;
      case 'PLAYING':
        if (code === 'Space') {
          if (this.player.startSweep()) this.onSweep();
        } else if (code === 'ShiftLeft' || code === 'ShiftRight') {
          if (this.player.startOverdrive()) this.onOverdriveStart();
        } else if (code === 'KeyP' || code === 'Escape') {
          this.state = 'PAUSED';
        }
        break;
      case 'PAUSED':
        if (code === 'KeyP' || code === 'Escape' || code === 'Enter') this.state = 'PLAYING';
        break;
      case 'GAME_OVER':
        if ((code === 'KeyR' || code === 'Enter') && this.overTime > 0.5) this.startGame();
        break;
    }
  }

  startGame() {
    this.reset();
    this.state = 'PLAYING';
  }

  // ---------- events ----------
  onSweep() {
    const p = this.player;
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2;
      this.addParticle(new Particle(p.cx + Math.cos(a) * 20, p.cy + Math.sin(a) * 20,
        Math.cos(a) * 320, Math.sin(a) * 320, 0.3, COLORS.yellow, 3));
    }
  }

  onDash() {
    const p = this.player;
    for (let i = 0; i < 10; i++) {
      this.addParticle(new Particle(p.cx + rand(-10, 10), p.cy + rand(-20, 20),
        -p.dashVx * 0.2 + rand(-40, 40), -p.dashVy * 0.2 + rand(-40, 40), 0.3, COLORS.white, 3));
    }
  }

  onOverdriveStart() {
    this.canvas.classList.add('overdrive');
    this.flash = 0.2;
    this.flashColor = COLORS.white;
    this.banner = { text: 'OVERDRIVE!', life: 1.6, max: 1.6, color: COLORS.yellow };
    this.shake = Math.max(this.shake, 8);
  }

  onOverdriveEnd() {
    this.canvas.classList.remove('overdrive');
  }

  destroyEnemy(e, cause, dx, dy) {
    e.knock(dx, dy);
    this.kills++;
    this.addScore(CONFIG.score.kill, e.cx, e.cy, null, e.color);
    this.player.addMeter(cause === 'ram' ? CONFIG.overdrive.gainRam : CONFIG.overdrive.gainKill);
    this.explode(e.cx, e.cy, e.color, 18, 260);
    this.shake = Math.max(this.shake, 5);
  }

  hitPlayer(e) {
    const p = this.player;
    e.alive = false;
    this.explode(e.cx, e.cy, e.color, 24, 300);
    p.health--;
    p.invuln = CONFIG.player.invulnTime;
    this.shake = 14;
    this.flash = 0.25;
    this.flashColor = COLORS.red;
    if (p.health <= 0) this.killPlayer();
  }

  killPlayer() {
    const p = this.player;
    p.alive = false;
    p.overdrive = 0;
    this.onOverdriveEnd();
    for (let i = 0; i < 3; i++) {
      this.explode(p.cx + rand(-14, 14), p.cy + rand(-20, 20), i === 1 ? COLORS.yellow : COLORS.cyan, 30, 380);
    }
    this.shake = 22;
    this.state = 'DYING';
    this.deathTimer = 1.3;
  }

  gameOver() {
    this.state = 'GAME_OVER';
    this.overTime = 0;
    this.score = Math.floor(this.score);
    if (this.score > this.highScore) {
      this.highScore = this.score;
      this.newHigh = true;
      saveHighScore(this.highScore);
    }
  }

  awardNearMiss(e) {
    this.nearMisses++;
    this.player.addMeter(CONFIG.overdrive.gainNearMiss);
    const p = this.player;
    this.addScore(CONFIG.score.nearMiss, p.cx, p.y - 10, 'NEAR MISS', COLORS.cyan);
    const sx = (p.cx + e.cx) / 2, sy = p.cy;
    for (let i = 0; i < 6; i++) {
      this.addParticle(new Particle(sx, sy, rand(-120, 120), rand(-60, 160), 0.3, COLORS.cyan, 2));
    }
  }

  addScore(base, x, y, label, color) {
    const pts = base * this.scoreMult;
    this.score += pts;
    const text = label ? `${label} +${pts}` : `+${pts}`;
    this.floaters.push({ x, y, text, color: color || COLORS.white, life: 0.9, max: 0.9 });
  }

  addParticle(p) {
    if (this.particles.length < CONFIG.fx.maxParticles) this.particles.push(p);
  }

  explode(x, y, color, n, power) {
    const drift = this.scrollSpeed * 0.3;
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(0.3, 1) * power;
      this.addParticle(new Particle(x, y, Math.cos(a) * sp, Math.sin(a) * sp + drift,
        rand(0.35, 0.8), i % 3 === 0 ? COLORS.white : color, rand(2, 4.5)));
    }
    this.addParticle(new Particle(x, y, 0, 0, 0.4, color, 8, 'ring'));
  }

  newStreak(anywhere) {
    return {
      x: rand(0, CONFIG.width),
      y: anywhere ? rand(-CONFIG.height, CONFIG.height) : rand(-200, -20),
      len: rand(20, 60),
    };
  }

  // ---------- update ----------
  update(dt, rawDt) {
    this.time += dt;
    this.fps = this.fps * 0.9 + (1 / Math.max(rawDt, 1e-4)) * 0.1;
    if (this.state === 'PAUSED') return;

    const p = this.player;
    const playing = this.state === 'PLAYING';

    if (playing) {
      this.elapsed += dt;
      const lvl = Math.floor(this.elapsed / CONFIG.difficulty.levelTime);
      if (lvl > this.level) {
        this.level = lvl;
        this.banner = { text: `SPEED UP · LEVEL ${lvl + 1}`, life: 2.2, max: 2.2, color: COLORS.cyan };
      }
    }

    const odMult = p.overdriveActive ? CONFIG.overdrive.speedMult : 1;
    this.scrollSpeed = CONFIG.scroll.base * (this.state === 'START' ? 1 : this.levelSpeedMult) * odMult;
    this.scrollY += this.scrollSpeed * dt;

    if (playing) {
      p.update(dt, this.input);
      if (this.wasOverdrive && !p.overdriveActive) this.onOverdriveEnd();
      this.wasOverdrive = p.overdriveActive;
      this.spawner.update(dt);
    }

    if (p.alive && this.state !== 'GAME_OVER') this.emitExhaust();

    for (const e of this.enemies) e.update(dt, this);
    if (playing && p.alive) this.checkCollisions();

    for (const pt of this.particles) pt.update(dt);
    for (const f of this.floaters) {
      f.life -= dt;
      f.y -= 50 * dt;
    }
    for (const s of this.streaks) {
      s.y += this.scrollSpeed * 1.7 * dt;
      if (s.y > CONFIG.height) Object.assign(s, this.newStreak(false));
    }

    this.enemies = this.enemies.filter(e => e.alive);
    this.particles = this.particles.filter(pt => pt.alive);
    this.floaters = this.floaters.filter(f => f.life > 0);

    if (playing) this.score += CONFIG.score.perSecond * dt * this.scoreMult;

    if (this.state === 'DYING') {
      this.deathTimer -= dt;
      if (this.deathTimer <= 0) this.gameOver();
    }
    if (this.state === 'GAME_OVER') this.overTime += dt;

    this.shake *= Math.pow(0.85, dt * 60);
    this.flash = Math.max(0, this.flash - dt);
    if (this.banner) {
      this.banner.life -= dt;
      if (this.banner.life <= 0) this.banner = null;
    }
  }

  emitExhaust() {
    const p = this.player;
    const color = p.overdriveActive ? COLORS.yellow : (p.ramming ? COLORS.white : COLORS.cyan);
    for (const side of [-8, 8]) {
      this.addParticle(new Particle(p.cx + side + rand(-2, 2), p.y + p.h,
        rand(-20, 20) - p.vx * 0.1, rand(160, 240), rand(0.2, 0.35), color, rand(2, 3.5)));
    }
  }

  checkCollisions() {
    const p = this.player;
    const hb = p.hitbox;
    const near = expand(hb, CONFIG.nearMiss.margin);
    const R = CONFIG.sweep.radius;

    for (const e of this.enemies) {
      if (!e.alive || e.state !== 'active') continue;
      const eb = e.bounds;

      if (p.sweeping && circleRect(p.cx, p.cy, R, eb)) {
        this.destroyEnemy(e, 'sweep', e.cx - p.cx, e.cy - p.cy);
        continue;
      }

      if (aabb(hb, eb)) {
        e.touched = true;
        if (p.overdriveActive) {
          this.destroyEnemy(e, 'overdrive', sign(e.cx - p.cx) || 1, -0.6);
        } else if (p.ramming) {
          const dx = p.dashVx ? sign(p.dashVx) : (sign(e.cx - p.cx) || 1);
          const dy = p.dashVy ? sign(p.dashVy) : -0.4;
          this.destroyEnemy(e, 'ram', dx, dy);
        } else if (p.invuln <= 0) {
          this.hitPlayer(e);
          if (!p.alive) return;
        }
        continue;
      }

      if (!e.grazed && aabb(near, eb)) e.grazed = true;
      if (e.grazed && !e.touched && !e.nearMissCounted && e.y > p.y + p.h) {
        e.nearMissCounted = true;
        this.awardNearMiss(e);
      }
    }
  }

  // ---------- draw ----------
  draw() {
    const ctx = this.ctx;
    const W = CONFIG.width, H = CONFIG.height;
    ctx.setTransform(this.pxScale, 0, 0, this.pxScale, 0, 0);

    ctx.save();
    if (this.shake > 0.3) ctx.translate(rand(-1, 1) * this.shake, rand(-1, 1) * this.shake);
    this.drawTrack(ctx);

    for (const e of this.enemies) e.draw(ctx);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const pt of this.particles) pt.draw(ctx);
    ctx.restore();

    if (this.player.alive) this.player.draw(ctx, this.time);

    for (const f of this.floaters) {
      ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
      drawText(ctx, f.text, f.x, f.y, 14, f.color, 'center', 8);
    }
    ctx.globalAlpha = 1;

    if (this.debug) this.drawHitboxes(ctx);
    ctx.restore();

    if (this.flash > 0) {
      ctx.globalAlpha = clamp(this.flash * 2, 0, 0.5);
      ctx.fillStyle = this.flashColor;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    if (this.state !== 'START') this.drawHUD(ctx);
    if (this.banner && this.state === 'PLAYING') this.drawBanner(ctx);

    if (this.state === 'START') this.drawStartScreen(ctx);
    else if (this.state === 'PAUSED') this.drawPauseScreen(ctx);
    else if (this.state === 'GAME_OVER') this.drawGameOverScreen(ctx);

    if (this.debug) this.drawDebugText(ctx);
  }

  drawTrack(ctx) {
    const W = CONFIG.width, H = CONFIG.height, R = CONFIG.road;
    const sy = this.scrollY;

    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(-30, -30, W + 60, H + 60);
    ctx.fillStyle = COLORS.road;
    ctx.fillRect(R.left, -30, R.right - R.left, H + 60);

    // Rumble strips on the shoulders.
    const strip = 30, period = strip * 2, off = sy % period;
    for (let y = off - period; y < H + period; y += period) {
      ctx.fillStyle = 'rgba(255, 43, 214, 0.45)';
      ctx.fillRect(4, y, R.left - 10, strip);
      ctx.fillRect(R.right + 6, y, W - R.right - 10, strip);
      ctx.fillStyle = 'rgba(0, 240, 255, 0.12)';
      ctx.fillRect(4, y + strip, R.left - 10, strip);
      ctx.fillRect(R.right + 6, y + strip, W - R.right - 10, strip);
    }

    // Synth grid.
    const g = 80, goff = sy % g;
    ctx.strokeStyle = 'rgba(140, 70, 255, 0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let y = goff - g; y < H + g; y += g) {
      ctx.moveTo(R.left, y);
      ctx.lineTo(R.right, y);
    }
    ctx.stroke();

    // Lane markers.
    const laneW = (R.right - R.left) / R.lanes;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
    ctx.lineWidth = 3;
    ctx.setLineDash([36, 44]);
    ctx.lineDashOffset = -(sy % 80);
    ctx.beginPath();
    for (let i = 1; i < R.lanes; i++) {
      const x = R.left + i * laneW;
      ctx.moveTo(x, -30);
      ctx.lineTo(x, H + 30);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // Neon rails.
    ctx.strokeStyle = COLORS.cyan;
    ctx.shadowColor = COLORS.cyan;
    ctx.shadowBlur = 12;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(R.left, -30);
    ctx.lineTo(R.left, H + 30);
    ctx.moveTo(R.right, -30);
    ctx.lineTo(R.right, H + 30);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Speed streaks — brighter as speed climbs.
    const intensity = clamp((this.scrollSpeed / CONFIG.scroll.base - 0.6) * 0.25, 0.08, 0.6);
    ctx.strokeStyle = `rgba(200, 220, 255, ${intensity})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (const s of this.streaks) {
      const len = s.len * (this.scrollSpeed / CONFIG.scroll.base);
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x, s.y + len);
    }
    ctx.stroke();
  }

  drawHUD(ctx) {
    const W = CONFIG.width, H = CONFIG.height, p = this.player;
    const P = CONFIG.player, S = CONFIG.sweep, D = CONFIG.dash, O = CONFIG.overdrive;

    // Top panel.
    ctx.fillStyle = 'rgba(7, 7, 15, 0.7)';
    ctx.fillRect(0, 0, W, CONFIG.hud.top);
    drawText(ctx, 'SCORE', 14, 18, 11, COLORS.dim);
    drawText(ctx, String(Math.floor(this.score)).padStart(7, '0'), 14, 42, 22, COLORS.cyan, 'left', 8);
    drawText(ctx, 'LEVEL', W / 2, 18, 11, COLORS.dim, 'center');
    drawText(ctx, String(this.level + 1), W / 2, 42, 22, COLORS.yellow, 'center', 8);
    drawText(ctx, 'HULL', W - 14, 18, 11, COLORS.dim, 'right');
    for (let i = 0; i < P.maxHealth; i++) {
      const x = W - 24 - i * 26, y = 33, s = 9;
      ctx.beginPath();
      ctx.moveTo(x, y - s);
      ctx.lineTo(x + s, y);
      ctx.lineTo(x, y + s);
      ctx.lineTo(x - s, y);
      ctx.closePath();
      // Pips are laid out right-to-left, so hull depletes from the left.
      if (i < p.health) {
        ctx.fillStyle = COLORS.magenta;
        ctx.shadowColor = COLORS.magenta;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
      } else {
        ctx.strokeStyle = 'rgba(255, 43, 214, 0.35)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    // Bottom panel.
    const by = H - CONFIG.hud.bottom;
    ctx.fillStyle = 'rgba(7, 7, 15, 0.7)';
    ctx.fillRect(0, by, W, CONFIG.hud.bottom);

    // Overdrive bar.
    const bx = 14, bw = 290, bh = 14, barY = H - 26;
    const ratio = p.meter / O.max;
    const pulse = 0.55 + 0.45 * Math.sin(this.time * 10);
    if (p.overdriveActive) {
      drawText(ctx, 'OVERDRIVE ACTIVE', bx, barY - 8, 11, COLORS.yellow, 'left', 6);
    } else if (p.meterFull && this.state === 'PLAYING') {
      ctx.globalAlpha = pulse;
      drawText(ctx, 'OVERDRIVE READY · SHIFT!', bx, barY - 8, 11, COLORS.yellow, 'left', 8);
      ctx.globalAlpha = 1;
    } else {
      drawText(ctx, 'OVERDRIVE', bx, barY - 8, 11, COLORS.dim);
    }
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + 0.5, barY + 0.5, bw, bh);
    const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    grad.addColorStop(0, COLORS.magenta);
    grad.addColorStop(1, COLORS.yellow);
    ctx.fillStyle = p.overdriveActive ? COLORS.yellow : grad;
    if (p.meterFull && !p.overdriveActive) ctx.globalAlpha = 0.6 + 0.4 * pulse;
    ctx.fillRect(bx + 2, barY + 2, Math.max(0, (bw - 3) * ratio), bh - 3);
    ctx.globalAlpha = 1;

    // Ability cooldown pills.
    const pill = (label, x, w, ready) => {
      drawText(ctx, label, x, barY - 8, 11, ready >= 1 ? COLORS.cyan : COLORS.dim);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.strokeRect(x + 0.5, barY + 0.5, w, bh);
      ctx.fillStyle = ready >= 1 ? COLORS.cyan : 'rgba(0, 240, 255, 0.35)';
      ctx.fillRect(x + 2, barY + 2, (w - 3) * clamp(ready, 0, 1), bh - 3);
    };
    pill('SWEEP', 318, 72, 1 - p.sweepCooldown / S.cooldown);
    pill('DASH', 396, 70, 1 - p.dashCooldown / D.cooldown);
  }

  drawBanner(ctx) {
    const b = this.banner;
    const t = b.life / b.max;
    ctx.globalAlpha = clamp(t * 2, 0, 1);
    drawText(ctx, b.text, CONFIG.width / 2, CONFIG.height * 0.3, 26, b.color, 'center', 16);
    ctx.globalAlpha = 1;
  }

  dimScreen(ctx, alpha) {
    ctx.fillStyle = `rgba(7, 7, 15, ${alpha})`;
    ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
  }

  drawStartScreen(ctx) {
    const W = CONFIG.width, cx = W / 2;
    this.dimScreen(ctx, 0.6);
    drawText(ctx, 'APEX', cx, 220, 76, COLORS.cyan, 'center', 24);
    drawText(ctx, 'OVERRIDE', cx, 286, 52, COLORS.magenta, 'center', 24);
    drawText(ctx, 'WEB PROOF OF CONCEPT', cx, 320, 13, COLORS.dim, 'center');

    const lines = [
      ['MOVE / DRIFT', 'WASD / ARROWS'],
      ['AERO-JOSTLE', 'DOUBLE-TAP DIR'],
      ['CYCLONE-SWEEP', 'SPACE'],
      ['OVERDRIVE', 'SHIFT (WHEN FULL)'],
      ['PAUSE', 'P'],
    ];
    lines.forEach(([action, key], i) => {
      const y = 392 + i * 28;
      drawText(ctx, action, 70, y, 15, COLORS.white);
      drawText(ctx, key, W - 70, y, 15, COLORS.yellow, 'right');
    });
    drawText(ctx, 'Smash Blockers & skim close for Overdrive.', cx, 548, 13, COLORS.dim, 'center');

    if (Math.floor(this.time * 2) % 2 === 0) {
      drawText(ctx, 'PRESS ENTER TO START', cx, 620, 22, COLORS.yellow, 'center', 14);
    }
    if (this.highScore > 0) {
      drawText(ctx, `HI-SCORE ${String(this.highScore).padStart(7, '0')}`, cx, 670, 15, COLORS.cyan, 'center');
    }
  }

  drawPauseScreen(ctx) {
    const cx = CONFIG.width / 2;
    this.dimScreen(ctx, 0.6);
    drawText(ctx, 'PAUSED', cx, 380, 52, COLORS.cyan, 'center', 20);
    drawText(ctx, 'PRESS P TO RESUME', cx, 430, 16, COLORS.white, 'center');
  }

  drawGameOverScreen(ctx) {
    const cx = CONFIG.width / 2;
    this.dimScreen(ctx, 0.7);
    drawText(ctx, 'WRECKED', cx, 250, 62, COLORS.magenta, 'center', 24);
    const stats = [
      ['SCORE', String(this.score).padStart(7, '0')],
      ['TIME', formatTime(this.elapsed)],
      ['LEVEL', String(this.level + 1)],
      ['KILLS', String(this.kills)],
      ['NEAR MISSES', String(this.nearMisses)],
      ['HI-SCORE', String(this.highScore).padStart(7, '0')],
    ];
    stats.forEach(([k, v], i) => {
      const y = 320 + i * 32;
      drawText(ctx, k, 90, y, 17, COLORS.dim);
      drawText(ctx, v, CONFIG.width - 90, y, 17, i === 0 ? COLORS.cyan : COLORS.white, 'right');
    });
    if (this.newHigh && Math.floor(this.time * 3) % 2 === 0) {
      drawText(ctx, 'NEW HIGH SCORE!', cx, 540, 22, COLORS.yellow, 'center', 14);
    }
    if (this.overTime > 0.5) {
      drawText(ctx, 'PRESS R TO RESTART', cx, 610, 20, COLORS.cyan, 'center', 10);
    }
  }

  drawHitboxes(ctx) {
    const p = this.player;
    ctx.lineWidth = 1;
    if (p.alive) {
      const hb = p.hitbox, nm = expand(hb, CONFIG.nearMiss.margin);
      ctx.strokeStyle = '#00ff66';
      ctx.strokeRect(hb.x, hb.y, hb.w, hb.h);
      ctx.strokeStyle = 'rgba(0, 255, 102, 0.35)';
      ctx.strokeRect(nm.x, nm.y, nm.w, nm.h);
      ctx.beginPath();
      ctx.arc(p.cx, p.cy, CONFIG.sweep.radius, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.strokeStyle = '#ff3333';
    for (const e of this.enemies) if (e.state === 'active') ctx.strokeRect(e.x, e.y, e.w, e.h);
  }

  drawDebugText(ctx) {
    const lines = [
      `FPS ${this.fps.toFixed(0)}`,
      `ENEMIES ${this.enemies.length}`,
      `PARTICLES ${this.particles.length}`,
      `SCROLL ${this.scrollSpeed.toFixed(0)}`,
      `SPAWN ${this.spawnInterval.toFixed(2)}s`,
      `STATE ${this.state}`,
    ];
    lines.forEach((l, i) => drawText(ctx, l, 10, 72 + i * 14, 11, '#00ff66'));
  }
}

// =====================================================================
// Boot & main loop
// =====================================================================
const game = new Game(document.getElementById('gameCanvas'));
window.__game = game; // debug / test hook

let lastFrame = performance.now();
function frame(now) {
  const rawDt = Math.max(0, (now - lastFrame) / 1000);
  lastFrame = now;
  const dt = Math.min(rawDt, 1 / 30); // clamp so a stalled tab can't tunnel through enemies
  game.update(dt, rawDt);
  game.draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
